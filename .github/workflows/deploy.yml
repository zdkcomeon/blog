# action 的名称
name: Deploy GitHub Pages

# 触发条件：在 push 到 master 分支后
on:
  push:
    branches:
      - master

# 任务
jobs:
  build-and-deploy:
    # 服务器环境：最新版 Ubuntu
    runs-on: ubuntu-latest
    # 允许自动生成的 GITHUB_TOKEN 推送部署分支。
    permissions:
      contents: write
    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 设置 Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 生成静态文件
      - name: Build
        run: npm ci && npm run docs:build

      # 部署到 GitHub Pages
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ github.token }}
          # 打包后的文件部署到哪个分支上
          branch: gh-pages
          # 打包后的文件在哪里
          folder: docs/.vuepress/dist
